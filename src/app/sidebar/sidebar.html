<aside class="sidebar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <span class="brand-copy">
      <strong>{{ board.teamName() }}</strong>
      <small>Saved in this browser</small>
    </span>
  </div>

  <nav aria-label="Workspace">
    <p class="nav-label">You</p>
    @for (item of yours; track item.id) {
      <button
        type="button"
        class="nav-item"
        [class.is-active]="ui.nav() === item.id"
        (click)="select(item.id)"
      >
        <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
        <span class="nav-text">{{ item.label }}</span>
        @if (countFor(item.id); as count) {
          <span class="nav-count">{{ count }}</span>
        }
      </button>
    }

    <p class="nav-label">Team</p>
    @for (item of team; track item.id) {
      <button
        type="button"
        class="nav-item"
        [class.is-active]="ui.nav() === item.id"
        (click)="select(item.id)"
      >
        <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
        <span class="nav-text">{{ item.label }}</span>
        @if (countFor(item.id); as count) {
          <span class="nav-count">{{ count }}</span>
        }
      </button>
    }
  </nav>

  <div class="sidebar-foot">
    <button type="button" class="text-btn" (click)="ui.openDialog({ type: 'help' })">Shortcuts</button>
    <button type="button" class="text-btn" (click)="reset()">Reset sample data</button>
    @if (board.currentMember(); as member) {
      <div class="you">
        <span class="avatar" [style.background]="avatarColor(member.id)">{{ initials(member.name) }}</span>
        <span class="nav-text">
          <strong>{{ member.name }}</strong>
          <small>You</small>
        </span>
      </div>
    }
  </div>
</aside>
